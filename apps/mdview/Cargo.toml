[package]
name = "mdview"
version = "0.1.0"
edition = "2021"
description = "mdview — lightweight Rust markdown renderer (Tauri desktop + terminal + Neovim live preview)"
license = "MIT"

[[bin]]
name = "mdview"
path = "src/main.rs"

[features]
default = ["gui"]
gui = ["dep:wry", "dep:tao"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
comrak = { workspace = true }
crossterm = "0.28"
image = { version = "0.25", default-features = false, features = ["png"] }
mdview-config = { path = "../../crates/mdview-config" }
mdview-core = { path = "../../crates/mdview-core" }
mdview-ext-d2 = { path = "../../crates/mdview-ext-d2" }
mdview-ext-drawio = { path = "../../crates/mdview-ext-drawio" }
mdview-ext-frontmatter = { path = "../../crates/mdview-ext-frontmatter" }
mdview-ext-highlight = { path = "../../crates/mdview-ext-highlight" }
mdview-ext-math = { path = "../../crates/mdview-ext-math" }
mdview-ext-mermaid = { path = "../../crates/mdview-ext-mermaid" }
mdview-ext-plotly = { path = "../../crates/mdview-ext-plotly" }
mdview-nvim = { path = "../../crates/mdview-nvim" }
mdview-pager = { path = "../../crates/mdview-pager" }
mdview-render-html = { path = "../../crates/mdview-render-html" }
mdview-render-terminal = { path = "../../crates/mdview-render-terminal" }
mdview-theme = { path = "../../crates/mdview-theme" }
notify = "6"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
unicode-segmentation = "1"
unicode-width = "0.2"
urlencoding = "2"

wry = { version = "0.54", optional = true }
tao = { version = "0.34", optional = true }

[target."cfg(windows)".dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging",
] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_Security",
] }

[target."cfg(unix)".dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
anyhow = "1"
ico = "0.4"
resvg = "0.44"
tiny-skia = "0.11"
usvg = "0.44"

[target."cfg(windows)".build-dependencies]
winresource = "0.1"

[package.metadata.docs.rs]
all-features = false
