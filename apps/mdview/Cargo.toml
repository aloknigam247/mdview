[package]
name = "mdview"
version = "0.1.0"
edition = "2021"
description = "mdview — lightweight Rust markdown renderer (Tauri desktop + terminal + Neovim live preview)"
license = "MIT"

[[bin]]
name = "mdview"
path = "src/main.rs"

[features]
default = ["stubs", "gui"]
stubs = []
gui = ["dep:wry", "dep:tao"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
comrak = { workspace = true }
mdview-core = { path = "../../crates/mdview-core" }
mdview-ext-drawio = { path = "../../crates/mdview-ext-drawio" }
mdview-ext-highlight = { path = "../../crates/mdview-ext-highlight" }
mdview-ext-math = { path = "../../crates/mdview-ext-math" }
mdview-ext-mermaid = { path = "../../crates/mdview-ext-mermaid" }
mdview-ext-plotly = { path = "../../crates/mdview-ext-plotly" }
notify = "6"
tokio = { version = "1", features = ["full"] }

wry = { version = "0.54", optional = true }
tao = { version = "0.34", optional = true }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_Security",
] }

[target."cfg(unix)".dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
anyhow = "1"

[package.metadata.docs.rs]
all-features = false
