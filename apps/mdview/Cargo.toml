[package]
name = "mdview"
version = "0.1.0"
edition = "2021"
description = "mdview — lightweight Rust markdown renderer (Tauri desktop + terminal + Neovim live preview)"
license = "MIT OR Apache-2.0"

[[bin]]
name = "mdview"
path = "src/main.rs"

[features]
default = ["stubs"]
stubs = []
tauri-shell = ["dep:tauri"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
notify = "6"
tokio = { version = "1", features = ["full"] }

tauri = { version = "2", features = [], optional = true }

# Sibling crates are resolved via workspace when present; during isolated
# build the `stubs` feature provides minimal local replacements.
# [dependencies.mdview-core]
# path = "../../crates/mdview-core"
# version = "0.1"
# optional = true

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_Security",
] }

[target."cfg(unix)".dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
anyhow = "1"

[package.metadata.docs.rs]
all-features = false
