name: Release please

on:
  schedule:
    - cron: '30 18 * * *'
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  version:
    if: >-
      ${{ github.repository == 'aloknigam247/mdview' &&
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: release-please-${{ github.repository }}-main
      cancel-in-progress: false
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
    steps:
      - name: Check out version automation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Finish tags for previously merged version PRs
        run: python3 scripts/version_pr.py prepare
      - name: Reconcile version PR without publishing a release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4 (package 4.4.1)
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true
          target-branch: main
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
      - name: Auto-merge the version PR and record its tag
        run: python3 scripts/version_pr.py merge
