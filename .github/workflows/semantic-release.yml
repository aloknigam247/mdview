name: Version updates

on:
  schedule:
    - cron: '30 18 * * *'
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: release-please-${{ github.repository }}-main
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
    steps:
      - name: Require versioning token
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::Set the repository secret RELEASE_PLEASE_TOKEN to a PAT that can push version commits and tags."
            exit 1
          fi
      - name: Check out main and version history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main
      - name: Set up Node.js for versioning
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.15.0'
      - name: Install locked versioning tools
        run: npm --prefix .github/release ci --ignore-scripts --no-audit --no-fund
      - name: Commit version updates and Git tags only
        run: node .github/release/node_modules/semantic-release/bin/semantic-release.js --extends ./.github/release/release.config.cjs
