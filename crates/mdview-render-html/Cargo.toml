[package]
name = "mdview-render-html"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
comrak = "0.29"
serde = { version = "1", features = ["derive"] }
thiserror = "1"
tracing = "0.1"
urlencoding = "2"

[dev-dependencies]

[[example]]
name = "render_html_serve"
path = "examples/render_html_serve.rs"

[[example]]
name = "render_html_snapshot"
path = "examples/render_html_snapshot.rs"
