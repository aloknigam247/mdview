[package]
name = "mdview-render-html"
version.workspace = true
edition = "2021"
publish.workspace = true

[dependencies]
comrak = "0.29"
mdview-core = { path = "../mdview-core" }
mdview-theme = { path = "../mdview-theme" }
serde = { version = "1", features = ["derive"] }
thiserror = "1"
tracing = "0.1"
urlencoding = "2"

[dev-dependencies]

[[example]]
name = "render_html_serve"
path = "examples/render_html_serve.rs"

[[example]]
name = "render_html_snapshot"
path = "examples/render_html_snapshot.rs"
