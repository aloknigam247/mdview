[package]
name = "mdview-ext-frontmatter"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Frontmatter (YAML) extension for mdview: parses, strips, and renders a hero card."

[dependencies]
comrak = "0.29"
mdview-core = { path = "../mdview-core" }
mdview-theme = { path = "../mdview-theme" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
tracing = "0.1"
