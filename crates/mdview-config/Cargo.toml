[package]
name = "mdview-config"
version = "0.1.0"
edition = "2021"
description = "User-facing TOML configuration for mdview (keymap + future options)"
license = "MIT"

[dependencies]
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
thiserror = "1"
toml = "0.8"
tracing = "0.1"

[lints.rust]
unsafe_code = "forbid"
