[package]
name = "mdview-ext-highlight"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
comrak = { version = "0.29", default-features = false }
once_cell = "1.19"
syntect = { version = "5.2", default-features = false, features = ["default-fancy"] }
thiserror = "1.0"

[dev-dependencies]
tiny_http = "0.12"

[[example]]
name = "demo_snapshot"
path = "examples/demo_snapshot.rs"

[[example]]
name = "demo_serve"
path = "examples/demo_serve.rs"
