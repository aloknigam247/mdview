[package]
name = "mdview-ext-highlight"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
comrak = { version = "0.29", default-features = false }
mdview-core = { path = "../mdview-core" }
once_cell = "1.19"
syntect = { version = "5.2", default-features = false, features = ["default-fancy"] }
thiserror = "1.0"

[dev-dependencies]
tiny_http = "0.12"

[[example]]
name = "ext_highlight_snapshot"
path = "examples/ext_highlight_snapshot.rs"

[[example]]
name = "ext_highlight_serve"
path = "examples/ext_highlight_serve.rs"
