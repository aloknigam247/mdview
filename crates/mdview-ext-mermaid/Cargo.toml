[package]
name = "mdview-ext-mermaid"
version = "0.1.0"
edition = "2021"
description = "Mermaid diagram extension for mdview"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
comrak = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
which = "6"

[dev-dependencies]
tempfile = "3"

[[example]]
name = "ext_mermaid_snapshot"
path = "examples/ext_mermaid_snapshot.rs"

[[example]]
name = "ext_mermaid_serve"
path = "examples/ext_mermaid_serve.rs"
