[package]
name = "mdview-render-terminal"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Terminal (ANSI) renderer for mdview"

[dependencies]
comrak = "0.28"
textwrap = "0.16"
thiserror = "1"
unicode-width = "0.1"

[dev-dependencies]

[lib]
path = "src/lib.rs"

[[example]]
name = "demo_snapshot"
path = "examples/demo_snapshot.rs"
