[package]
name = "mdview-render-terminal"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Terminal (ANSI) renderer for mdview"

[dependencies]
comrak = "0.28"
mdview-sixel = { path = "../mdview-sixel" }
textwrap = "0.16"
thiserror = "1"
tracing = "0.1"
unicode-width = "0.1"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
unicode-width = "0.1"

[lib]
path = "src/lib.rs"

[[example]]
name = "render_terminal_snapshot"
path = "examples/render_terminal_snapshot.rs"
