[package]
name = "mdview-ext-plotly"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Plotly fenced-code extension for mdview"

[dependencies]
comrak = { workspace = true }
mdview-core = { path = "../mdview-core" }
serde_json = "1"
thiserror = { workspace = true }
which = "6"

[dev-dependencies]
tiny_http = "0.12"

[[example]]
name = "ext_plotly_snapshot"
path = "examples/ext_plotly_snapshot.rs"

[[example]]
name = "ext_plotly_serve"
path = "examples/ext_plotly_serve.rs"
