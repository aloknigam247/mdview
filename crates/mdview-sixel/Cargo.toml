[package]
name = "mdview-sixel"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Terminal capability probe + resvg SVG→PNG + PNG→sixel for mdview"

[dependencies]
base64 = "0.22"
color_quant = "1.1"
crossterm = "0.28"
icy_sixel = "0.1"
image = { version = "0.25", default-features = false, features = ["png"] }
resvg = "0.44"
thiserror = "1"
tiny-skia = "0.11"
usvg = "0.44"
