[package]
name = "mdview-ext-math"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Math extension for mdview: latex2mathml terminal fallback + KaTeX client asset."

[dependencies]
comrak = "0.29"
latex2mathml = "0.2"
mdview-core = { path = "../mdview-core" }
thiserror = "1"

[build-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

[dev-dependencies]
tiny_http = "0.12"

[[example]]
name = "ext_math_snapshot"
path = "examples/ext_math_snapshot.rs"

[[example]]
name = "ext_math_serve"
path = "examples/ext_math_serve.rs"
