[package]
name = "mdview-ext-math"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Math extension for mdview: latex2mathml terminal fallback + KaTeX client asset."

[dependencies]
comrak = "0.29"
latex2mathml = "0.2"
thiserror = "1"

[build-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

[dev-dependencies]
tiny_http = "0.12"

[[example]]
name = "demo_snapshot"
path = "examples/demo_snapshot.rs"

[[example]]
name = "demo_serve"
path = "examples/demo_serve.rs"
